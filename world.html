<body class="world-page">
<div id="fit">
<div id="wx">
  <main id="wxStage">
    <canvas id="map" width="1280" height="720" aria-label="地圖"></canvas>

    <!-- 左上：適格者、名字、生命、金幣 -->
    <div class="wx-hud tl">
      <div class="who"><span id="wxFace" class="face"></span>
        <div><button id="wxName" type="button" class="nm" title="點一下更改名字"></button><div id="wxWorld" class="wl"></div></div></div>
      <div class="hpbar"><i id="wxHp"></i><span id="wxHpText"></span></div>
      <div class="gold"><span class="coin-ic"></span><span id="wxGold"></span> 金幣</div>
    </div>
    <!-- 右上：委託 -->
    <div class="wx-hud tr">
      <button id="logBtn" type="button" class="ghost">委託（L）</button>
      <button id="bagBtn" type="button" class="ghost">行囊（I）</button>
      <button id="muteBtn" type="button" class="ghost"></button>
      <button id="trackBtn" type="button" class="ghost" aria-controls="wxTrack">指示：收起</button>
    </div>
    <!-- 委託追蹤：每張委託的下一步 -->
    <ol id="wxTrack" class="wx-track" aria-label="委託進度"></ol>
    <!-- 下方：模式、Q 技能 -->
    <div class="wx-hud bl">
      <div id="modeChip" class="mode"></div>
      <button id="qBtn" type="button" class="qbtn"><span class="k">Q</span><span id="qName"></span><span id="qCd" class="cd"></span><i id="qMask"></i></button>
      <div class="wx-help">左鍵：移動／互動　右鍵：切換移動・攻擊</div>
    </div>
    <canvas id="mini" width="200" height="250" aria-label="小地圖"></canvas>

    <div id="wxToast" class="wx-toast hidden" role="status"></div>
    <div id="wxFade" class="wx-fade hidden"><b id="wxFadeText"></b></div>
    <div id="fatal" class="hidden" role="alert"></div>

    <div id="wxPanel" class="tv-overlay hidden" role="dialog" aria-modal="true">
      <div class="tv-card">
        <header><h2 id="wxPanelTitle"></h2><button type="button" class="ghost" data-close aria-label="關閉">關閉</button></header>
        <div id="wxPanelBody"></div>
      </div>
    </div>
  </main>
</div>
