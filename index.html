<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>選擇角色</title>
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/home.css">
</head>
<body>
<div id="home">
  <header class="home-head">
    <h1>選擇角色</h1>
    <p class="muted">選好角色後進入測試房間（3 隻史萊姆）</p>
  </header>

  <section id="cards" aria-label="角色"></section>

  <section id="detail" class="hidden">
    <div class="detail-main">
      <div class="detail-title">
        <span id="dIcon" class="icon big"></span>
        <div><h2 id="dName"></h2><p id="dSub" class="muted"></p></div>
      </div>
      <p id="dDesc"></p>
      <div id="dStats" class="stats"></div>
    </div>
    <div class="detail-skills">
      <h3>技能</h3>
      <ul id="dSkills"></ul>
    </div>
  </section>

  <div class="join">
    <p class="muted">行動順序每回合由 1d20 ＋ 速度 決定</p>
    <button type="button" id="goBtn" class="primary">進入測試房間</button>
  </div>
</div>
<script src="js/config.js"></script>
<script src="js/battle.js"></script>
<script src="js/characters/firsler.js"></script>
<script src="js/home.js"></script>
</body>
</html>
