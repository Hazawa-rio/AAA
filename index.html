<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>選擇角色</title>
<link rel="stylesheet" href="css/style.css?v=202611061806">
<link rel="stylesheet" href="css/home.css?v=202611061806">
</head>
<body>
<div id="home">
  <header class="home-head">
    <h1>選擇角色</h1>
    <p class="muted">選好角色和房間後開始戰鬥</p>
  </header>

  <p id="forcedNote" class="notice hidden">新手引導房固定使用教學版伊爾舒，角色選擇不會影響這個房間。</p>
  <section id="cards" aria-label="角色"></section>

  <section id="detail" class="hidden">
    <div class="detail-main">
      <div class="detail-title">
        <span id="dIcon" class="icon big"></span>
        <div><h2 id="dName"></h2><p id="dSub" class="muted"></p></div>
      </div>
      <p id="dDesc"></p>
      <div id="dStats" class="stats"></div>
    </div>
    <div class="detail-skills">
      <h3>技能</h3>
      <ul id="dSkills"></ul>
    </div>
  </section>

  <section>
    <h3 class="sec-title">選擇房間</h3>
    <div id="rooms"></div>
  </section>

  <div class="join">
    <p class="muted">行動順序在第一回合由 1d20 ＋ 速度 決定，之後沿用</p>
    <button type="button" id="goBtn" class="primary">進入房間</button>
  </div>
</div>
<script src="js/config.js?v=202611061806"></script>
<script src="js/battle.js?v=202611061806"></script>
<script src="js/characters/firsler.js?v=202611061806"></script>
<script src="js/characters/ilshu.js?v=202611061806"></script>
<script src="js/characters/ilshu-tutorial.js?v=202611061806"></script>
<script src="js/home.js?v=202611061806"></script>
</body>
</html>
